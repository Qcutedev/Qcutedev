name: live profile art

# Daily: draws the contribution snake (Platane/snk) and the player-stats HUD (tools/make_stats.py, real data
# from the GitHub API) and publishes both to the `output` branch, which README.md loads from
# raw.githubusercontent.com. If the stats step fails, the previously published stats files are kept.
on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the stats generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#9B6BFF&color_dots=#161E30,#123E4A,#1A6B78,#24A3B0,#3EE6EE
            dist/snake-light.svg?color_snake=#7A4FE0&color_dots=#E6EDF7,#B5ECF0,#6FD6DE,#2DB4C2,#15808C

      - name: Generate stats HUD
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet fonttools==4.68.0
          mkdir -p "$RUNNER_TEMP/fonts"
          # Press Start 2P and Pixelify Sans (SIL OFL 1.1), pinned to google/fonts commits
          curl -fsSL -o "$RUNNER_TEMP/fonts/pixel.ttf" \
            "https://raw.githubusercontent.com/google/fonts/dbd72d6ef9ebea750d33c02c7189633e972d6a40/ofl/pressstart2p/PressStart2P-Regular.ttf"
          curl -fsSL -o "$RUNNER_TEMP/fonts/body.ttf" \
            "https://raw.githubusercontent.com/google/fonts/9ce5017522020232f525003b39971ddb67e33243/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf"
          "$RUNNER_TEMP/venv/bin/python" tools/make_stats.py "$RUNNER_TEMP/fonts" dist "$OWNER"

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in stats.svg stats-m.svg; do
            [ -f "$f" ] || curl -fsSL -o "$f" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/$f" || rm -f "$f"
          done
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update live profile art"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
